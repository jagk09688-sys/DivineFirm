<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="72" viewBox="0 0 320 72" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Divine Firm logo</title>
  <desc id="logoDesc">Divine Firm wordmark with leaf and sparkle mark</desc>
  <defs>
    <linearGradient id="lg" x1="0" x2="1">
      <stop offset="0" stop-color="#29a37a"/>
      <stop offset="1" stop-color="#125a45"/>
    </linearGradient>
  </defs>
  <!-- mark -->
  <g transform="translate(8,8)">
    <rect width="56" height="56" rx="12" fill="url(#lg)" />
    <!-- leaf -->
    <path d="M30 20c-6 6-10 14-6 20 6-2 12-8 16-14s-6-12-10-6z" fill="#fff" opacity="0.95" transform="translate(-6,0) scale(1.1)"/>
    <!-- sparkle -->
    <path d="M44 12l2.8 6.2L53 21l-6.2 2.8L44 30l-2.8-6.2L35 21l6.2-2.8z" fill="#fff" opacity="0.9" transform="translate(-6,0) scale(0.45)"/>
  </g>
  <!-- wordmark -->
  <g transform="translate(80,46)">
    <text x="0" y="0" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" font-weight="800" font-size="28" fill="#125a45">Divine Firm</text>
  </g>
</svg>
